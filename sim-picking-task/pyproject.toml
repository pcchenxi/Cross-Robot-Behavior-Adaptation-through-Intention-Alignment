[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iail-sim-picking"
version = "0.1.0"
description = "Standalone data collection package for IAIL simulated picking."
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["iail_sim_picking*"]
